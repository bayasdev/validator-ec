# Dependabot opens a pull request when a dependency or an action has a new
# version, and right away when one has a security fix.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for the tools the library is built and tested with.
      development:
        dependency-type: development
    # A change to a runtime dependency gets a pull request of its own.
    open-pull-requests-limit: 5
    ignore:
      # Node's types follow the Node in .node-version, not the newest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
